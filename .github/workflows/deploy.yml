name: Deploy to GitHub Pages

# Build the Vite site and publish dist/ — NOT the raw source. Serving the
# source directly (the old "Pages from branch: main /" setting) is exactly what
# broke the site: the browser hit the un-bundled `import 'gsap'` and the film
# never ran. This builds first, so gsap is bundled and every asset carries the
# /happy-birthday-tree/ base path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
